<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>One octave in 12 equal steps, against the pure intervals of the harmonic series</title>
<rect width="800" height="372" fill="#fff"/>
<text x="40" y="24" font-weight="bold" fill="#222">One octave, from C to the next C</text>
<text x="40" y="62" fill="#1f6fb2">12-TET: twelve equal steps of 100 cents. Every key is the same.</text>
<line x1="40.0" y1="110" x2="760.0" y2="110" stroke="#333" stroke-width="2"/>
<line x1="40.0" y1="98" x2="40.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="40.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">C</text>
<line x1="100.0" y1="98" x2="100.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="100.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">C#</text>
<line x1="160.0" y1="98" x2="160.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="160.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">D</text>
<line x1="220.0" y1="98" x2="220.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="220.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">Eb</text>
<line x1="280.0" y1="98" x2="280.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="280.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">E</text>
<line x1="340.0" y1="98" x2="340.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="340.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">F</text>
<line x1="400.0" y1="98" x2="400.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="400.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">F#</text>
<line x1="460.0" y1="98" x2="460.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="460.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">G</text>
<line x1="520.0" y1="98" x2="520.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="520.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">G#</text>
<line x1="580.0" y1="98" x2="580.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="580.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">A</text>
<line x1="640.0" y1="98" x2="640.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="640.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">Bb</text>
<line x1="700.0" y1="98" x2="700.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="700.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">B</text>
<line x1="760.0" y1="98" x2="760.0" y2="122" stroke="#1f6fb2" stroke-width="2"/><text x="760.0" y="88" text-anchor="middle" fill="#1f6fb2" font-size="13">C</text>
<text x="40" y="170" fill="#c0392b">Pure (just) intervals: simple ratios of the harmonic series. They don't land on the grid.</text>
<line x1="229.4" y1="110" x2="229.4" y2="186" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="229.4" cy="110" r="4.5" fill="#c0392b"/>
<text x="229.4" y="200" text-anchor="middle" fill="#c0392b" font-size="13">minor third 6:5</text><text x="229.4" y="216" text-anchor="middle" fill="#555" font-size="12">316 cents (+16 vs 12-TET)</text>
<line x1="271.8" y1="110" x2="271.8" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="271.8" cy="110" r="4.5" fill="#c0392b"/>
<text x="271.8" y="244" text-anchor="middle" fill="#c0392b" font-size="13">major third 5:4</text><text x="271.8" y="260" text-anchor="middle" fill="#555" font-size="12">386 cents (-14 vs 12-TET)</text>
<line x1="338.8" y1="110" x2="338.8" y2="274" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="338.8" cy="110" r="4.5" fill="#c0392b"/>
<text x="338.8" y="288" text-anchor="middle" fill="#c0392b" font-size="13">fourth 4:3</text><text x="338.8" y="304" text-anchor="middle" fill="#555" font-size="12">498 cents (-2 vs 12-TET)</text>
<line x1="461.2" y1="110" x2="461.2" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="461.2" cy="110" r="4.5" fill="#c0392b"/>
<text x="461.2" y="244" text-anchor="middle" fill="#c0392b" font-size="13">fifth 3:2</text><text x="461.2" y="260" text-anchor="middle" fill="#555" font-size="12">702 cents (+2 vs 12-TET)</text>
<line x1="570.6" y1="110" x2="570.6" y2="186" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="570.6" cy="110" r="4.5" fill="#c0392b"/>
<text x="570.6" y="200" text-anchor="middle" fill="#c0392b" font-size="13">major sixth 5:3</text><text x="570.6" y="216" text-anchor="middle" fill="#555" font-size="12">884 cents (-16 vs 12-TET)</text>
<text x="40" y="338" fill="#555" font-size="12">A cent is a hundredth of a semitone. The equal-tempered major third is about 14 cents wider than a pure one:</text><text x="40" y="356" fill="#555" font-size="12">that is the slight shimmer, or beating, you hear in a held major chord.</text>
</svg>