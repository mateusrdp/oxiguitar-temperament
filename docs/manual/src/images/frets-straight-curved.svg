<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Straight frets compared with True Temperament's curved frets (schematic)</title>
<rect width="800" height="260" fill="#fff"/>
<text x="30" y="26" font-weight="bold" fill="#222" font-size="14">Straight frets: one position for all six strings</text>
<rect x="30" y="50" width="350" height="160" fill="#7a5230" rx="4"/>
<line x1="30" y1="64.0" x2="380" y2="64.0" stroke="#ddd" stroke-width="1.00"/>
<line x1="30" y1="90.5" x2="380" y2="90.5" stroke="#ddd" stroke-width="1.35"/>
<line x1="30" y1="117.0" x2="380" y2="117.0" stroke="#ddd" stroke-width="1.70"/>
<line x1="30" y1="143.5" x2="380" y2="143.5" stroke="#ddd" stroke-width="2.05"/>
<line x1="30" y1="170.0" x2="380" y2="170.0" stroke="#ddd" stroke-width="2.40"/>
<line x1="30" y1="196.5" x2="380" y2="196.5" stroke="#ddd" stroke-width="2.75"/>
<line x1="60" y1="50" x2="60" y2="210" stroke="#d8d8d8" stroke-width="4"/>
<line x1="132" y1="50" x2="132" y2="210" stroke="#d8d8d8" stroke-width="4"/>
<line x1="204" y1="50" x2="204" y2="210" stroke="#d8d8d8" stroke-width="4"/>
<line x1="276" y1="50" x2="276" y2="210" stroke="#d8d8d8" stroke-width="4"/>
<line x1="348" y1="50" x2="348" y2="210" stroke="#d8d8d8" stroke-width="4"/>
<text x="420" y="26" font-weight="bold" fill="#222" font-size="14">Curved frets: each string gets its own spot</text>
<rect x="420" y="50" width="350" height="160" fill="#7a5230" rx="4"/>
<line x1="420" y1="64.0" x2="770" y2="64.0" stroke="#ddd" stroke-width="1.00"/>
<line x1="420" y1="90.5" x2="770" y2="90.5" stroke="#ddd" stroke-width="1.35"/>
<line x1="420" y1="117.0" x2="770" y2="117.0" stroke="#ddd" stroke-width="1.70"/>
<line x1="420" y1="143.5" x2="770" y2="143.5" stroke="#ddd" stroke-width="2.05"/>
<line x1="420" y1="170.0" x2="770" y2="170.0" stroke="#ddd" stroke-width="2.40"/>
<line x1="420" y1="196.5" x2="770" y2="196.5" stroke="#ddd" stroke-width="2.75"/>
<polyline points="450.0,50.0 445.8,76.7 452.8,103.3 444.4,130.0 454.2,156.7 447.2,183.4 451.4,210.0" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-linejoin="round"/>
<polyline points="522.0,50.0 516.8,76.7 525.5,103.3 515.0,130.0 527.2,156.7 518.5,183.4 523.8,210.0" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-linejoin="round"/>
<polyline points="594.0,50.0 587.7,76.7 598.2,103.3 585.6,130.0 600.3,156.7 589.8,183.4 596.1,210.0" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-linejoin="round"/>
<polyline points="666.0,50.0 658.6,76.7 670.9,103.3 656.2,130.0 673.4,156.7 661.1,183.4 668.5,210.0" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-linejoin="round"/>
<polyline points="738.0,50.0 729.6,76.7 743.6,103.3 726.8,130.0 746.4,156.7 732.4,183.4 740.8,210.0" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-linejoin="round"/>
<text x="30" y="240" fill="#555" font-size="12">Schematic only: the real shapes are True Temperament's own, calculated for each string, gauge and fret, and the wiggles are a millimetre or two.</text>
</svg>