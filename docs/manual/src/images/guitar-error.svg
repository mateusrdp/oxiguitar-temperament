<text x="340.0" y="340" text-anchor="middle" fill="#555">12</text>
<text x="407.5" y="340" text-anchor="middle" fill="#555">15</text>
<text x="452.5" y="340" text-anchor="middle" fill="#555">17</text>
<text x="497.5" y="340" text-anchor="middle" fill="#555">19</text>
<text x="542.5" y="340" text-anchor="middle" fill="#555">21</text>
<text x="610.0" y="340" text-anchor="middle" fill="#555">24</text>
<text x="340.0" y="368" text-anchor="middle" fill="#333">fret</text>
<text x="18" y="180.0" transform="rotate(-90 18 180.0)" text-anchor="middle" fill="#333">cents sharp (+) or flat (-)</text>
