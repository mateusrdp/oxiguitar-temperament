<text x="62" y="169.4" text-anchor="end" fill="#555">+4</text>
<line x1="70" y1="133.3" x2="610" y2="133.3" stroke="#e5e5e5"/>
<text x="62" y="138.3" text-anchor="end" fill="#555">+6</text>
<line x1="70" y1="102.2" x2="610" y2="102.2" stroke="#e5e5e5"/>
<text x="62" y="107.2" text-anchor="end" fill="#555">+8</text>
<line x1="70" y1="71.1" x2="610" y2="71.1" stroke="#e5e5e5"/>
<text x="62" y="76.1" text-anchor="end" fill="#555">+10</text>
<line x1="70" y1="40.0" x2="610" y2="40.0" stroke="#e5e5e5"/>
<text x="62" y="45.0" text-anchor="end" fill="#555">+12</text>
<text x="92.5" y="340" text-anchor="middle" fill="#555">1</text>
<text x="137.5" y="340" text-anchor="middle" fill="#555">3</text>
