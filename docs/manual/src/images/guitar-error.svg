<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>How far an electric guitar's fretted notes are from equal temperament, by fret, after a normal setup</title>
