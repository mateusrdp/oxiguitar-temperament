[package]
name = "oxiguitar-temperament-plugin"
description = "The OxiGuitar temperament plugin: a fretted track plays as a real guitar or True Temperament frets would, chosen in the Track tab."
version = "0.3.0"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-temperament"
homepage = "https://github.com/mateusrdp/oxiguitar-temperament"
publish = false

[lib]
# An ordinary library for tests, and temperament.oxp when built with
# `--features oxp --crate-type cdylib` (build-oxp.sh).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
# The SDK, from OxiGuitar's repository; nothing of OxiGuitar's is on
# crates.io. At the commit of mateusrdp/oxiguitar#350 (plugin interface
# 2.0) until OxiGuitar 0.24.0 tags it. The models are our own code
# (src/intonation.rs, src/true_temperament.rs): no other library.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", rev = "d1e8347d1d2a69d8ac3caee6a07670d64cdef342" }

[dev-dependencies]
# The contract suite (tests/contract.rs) runs the built .oxp file through
# OxiGuitar's own plugin host.
oxiguitar-plugin-test = { git = "https://github.com/mateusrdp/oxiguitar", rev = "d1e8347d1d2a69d8ac3caee6a07670d64cdef342" }
oxiguitar-host = { git = "https://github.com/mateusrdp/oxiguitar", rev = "d1e8347d1d2a69d8ac3caee6a07670d64cdef342" }

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Small files. Keep the default `panic = "unwind"`: a panic is then caught
# and reported as an error instead of closing OxiGuitar.
lto = "thin"
codegen-units = 1
strip = "symbols"

# Its own workspace, wherever the folder is copied.
[workspace]
